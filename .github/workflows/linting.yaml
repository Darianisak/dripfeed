---
name: Linting Workflow
permissions:
  contents: "read"

# yamllint disable-line rule:truthy
on:
  - pull_request
  - push

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install NPM dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint --color --config eslint.config.mjs .

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python dependencies
        run: pip3 install --requirement requirements.txt

      - name: Run YAMLLint
        run: yamllint --config-file .yamllint --strict .

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python dependencies
        run: pip3 install --requirement requirements.txt

      - name: Run Semgrep
        run: semgrep scan --error .

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Show affected files
        run: bundle exec rubocop --config ./.rubocop.yml --list-target-files .

      - name: Run RuboCop
        run: bundle exec rubocop --raise-cop-error --extra-details --config ./.rubocop.yml .
